name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap hosted job: the only one that runs on fork pull requests.
  smoke:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Lint and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]" ruff
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q tests/test_gpu.py

  tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && matrix.python-version == '3.12')) && fromJSON('["self-hosted","uwplasma-cpu"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - run: uv venv && uv pip install -e ".[test]" pytest-xdist
      - run: .venv/bin/python -m pytest -q -n 3

  oldest-jax:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Python 3.10, JAX 0.4.38
    runs-on: ${{ (github.event_name != 'pull_request') && fromJSON('["self-hosted","uwplasma-cpu"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.10"
          enable-cache: false
      - run: uv venv && uv pip install -e ".[test]" pytest-xdist "jax==0.4.38" "jaxlib==0.4.38" "solvax==0.36.0" "numpy<2"
      - run: .venv/bin/python -m pytest -q -n 3

  wheel:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Installed wheel
    runs-on: ${{ (github.event_name != 'pull_request') && fromJSON('["self-hosted","uwplasma-cpu"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.10"
          enable-cache: false
      - name: Build, check and inspect the wheel
        run: |
          uv venv "$RUNNER_TEMP/build"
          uv pip install --python "$RUNNER_TEMP/build/bin/python" build twine
          "$RUNNER_TEMP/build/bin/python" -m build --outdir "$RUNNER_TEMP/dist"
          "$RUNNER_TEMP/build/bin/twine" check "$RUNNER_TEMP"/dist/*
          extra=$(unzip -Z1 "$RUNNER_TEMP"/dist/*.whl | grep -Ev '^(fax/[a-z_]+\.py|alfvex-[^/]+\.dist-info/.*)$' || true)
          test -z "$extra" || { echo "unexpected files in the wheel: $extra"; exit 1; }
      - name: Run an analytic case from the installed wheel, outside the checkout
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP"/dist/*.whl
          cp tests/install_smoke.py examples/quickstart.py "$RUNNER_TEMP"
          cd "$RUNNER_TEMP" && venv/bin/python -I install_smoke.py && venv/bin/python -I quickstart.py && venv/bin/fax --help

  full:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Lint, vmex path and coverage
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","uwplasma-cpu"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv venv && uv pip install -e ".[dev,vmex]"
      - run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - run: uvx cffconvert --validate
      - run: .venv/bin/python -m coverage run --branch --source=src/fax -m pytest -q -m 'not scheduled'
      - run: .venv/bin/python -m coverage report -m
      - run: |
          .venv/bin/python -m coverage json -q
          .venv/bin/python -c "import json; t = json.load(open('coverage.json'))['totals']; s, b = t['percent_statements_covered'], t['percent_branches_covered']; print(f'statements {s:.2f}%, branches {b:.2f}%'); assert min(s, b) >= 95"
      - run: .venv/bin/sphinx-build -q -W -b html docs docs/_build/html
