name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Lint and smoke
    runs-on: [self-hosted, uwplasma-cpu]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv venv && uv pip install -e ".[test]" ruff
      - run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - run: .venv/bin/python -m pytest -q tests/test_gpu.py

  tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Python ${{ matrix.python-version }}
    runs-on: [self-hosted, uwplasma-cpu]
    timeout-minutes: 60
    env:
      JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.jax-cache
      JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
      JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES: "0"
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run a short smoke on each version (the coverage job runs the full suite); main, nightly and manual runs test every version in full.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.10","3.12","3.13"]' || '["3.10","3.11","3.12","3.13"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - run: uv venv && uv pip install -e ".[test]" pytest-xdist
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .jax-cache
          key: jax-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: jax-${{ runner.os }}-py${{ matrix.python-version }}-
      - run: .venv/bin/python -m pytest -q -n 3 ${{ github.event_name == 'pull_request' && '-x tests/test_api.py tests/test_gpu.py' || '' }}

  # Keeps the required "Python 3.11" check reporting on pull requests, which skip that version.
  python-311-main-only:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    name: Python 3.11
    runs-on: [self-hosted, uwplasma-cpu]
    timeout-minutes: 5
    steps:
      - run: echo "Python 3.11 is tested on main and nightly"

  oldest-jax:
    # Skipped on pull requests (a skipped required check passes); main and nightly run it.
    if: github.event_name != 'pull_request'
    name: Python 3.10, JAX 0.4.38
    runs-on: [self-hosted, uwplasma-cpu]
    timeout-minutes: 60
    env:
      JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.jax-cache
      JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
      JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.10"
          enable-cache: false
      - run: uv venv && uv pip install -e ".[test]" pytest-xdist "jax==0.4.38" "jaxlib==0.4.38" "solvax==0.36.0" "numpy<2"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .jax-cache
          key: jax-${{ runner.os }}-oldest-jax-${{ hashFiles('pyproject.toml') }}
          restore-keys: jax-${{ runner.os }}-oldest-jax-
      - run: .venv/bin/python -m pytest -q -n 3

  wheel:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Installed wheel
    runs-on: [self-hosted, uwplasma-cpu]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.10"
          enable-cache: false
      - name: Build, check and inspect the wheel
        run: |
          uv venv "$RUNNER_TEMP/build"
          uv pip install --python "$RUNNER_TEMP/build/bin/python" build twine
          "$RUNNER_TEMP/build/bin/python" -m build --outdir "$RUNNER_TEMP/dist"
          "$RUNNER_TEMP/build/bin/twine" check "$RUNNER_TEMP"/dist/*
          extra=$(unzip -Z1 "$RUNNER_TEMP"/dist/*.whl | grep -Ev '^(fax/[a-z_]+\.py|alfvex-[^/]+\.dist-info/.*)$' || true)
          test -z "$extra" || { echo "unexpected files in the wheel: $extra"; exit 1; }
      - name: Run an analytic case from the installed wheel, outside the checkout
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP"/dist/*.whl
          cp tests/install_smoke.py examples/quickstart.py "$RUNNER_TEMP"
          cd "$RUNNER_TEMP" && venv/bin/python -I install_smoke.py && venv/bin/python -I quickstart.py && venv/bin/fax --help

  full:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Lint, vmex path and coverage
    runs-on: [self-hosted, uwplasma-cpu]
    timeout-minutes: 90
    env:
      JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.jax-cache
      JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
      JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv venv && uv pip install -e ".[dev,vmex]"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .jax-cache
          key: jax-${{ runner.os }}-full-${{ hashFiles('pyproject.toml') }}
          restore-keys: jax-${{ runner.os }}-full-
      - run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - run: uvx cffconvert --validate
      - run: .venv/bin/python -m coverage run --branch --source=src/fax -m pytest -q -m 'not scheduled'
      - run: .venv/bin/python -m coverage report -m
      - run: |
          .venv/bin/python -m coverage json -q
          .venv/bin/python -c "import json; t = json.load(open('coverage.json'))['totals']; s, b = t['percent_statements_covered'], t['percent_branches_covered']; print(f'statements {s:.2f}%, branches {b:.2f}%'); assert min(s, b) >= 95"
      - run: .venv/bin/sphinx-build -q -W -b html docs docs/_build/html
